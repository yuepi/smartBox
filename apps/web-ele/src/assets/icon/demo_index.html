      <u-icon name="arrow-right" color="#fff" size="20"></u-icon>
    </view>

    <!-- ===== 原生滚动内容区域  ===== -->
    <view class="scroll-content">
      <!-- 占位，背景图空出来一部分 -->

      </view>

      <view class="body-container">
        <view class="charging-container" v-if="chargingOrder.length > 0">
          <view class="charging-card">

            </view>

            <view class="card-center">

              </view>
              <view class="charging-time">

              </view>
            </view>

            <view class="card-right">
              <view class="end-btn" @click.stop="goToEndCharging(chargingOrder[0])">去结束</view>
            </view>
          </view>
        </view>
        <!-- 功能图标区域 - 四宫格 -->
        <view class="icon-wrap">
          <view class="icon-flex">
            <view class="icon-item" v-for="item in iconList" :key="item.id" @click="turnPage(item.url)">
              <view class="icon-card" :style="{ backgroundColor: item.bgColor }">
                <view class="icon-top">
                  <text class="icon-title" :style="{ color: item.color }">{{ item.txt }}</text>
                  <text class="icon-desc">{{ getItemDesc(item.id) }}</text>
                </view>
                <view class="icon-bottom">
                  <view class="icon-arrow">
                    <u-icon name="arrow-right" color="#333" size="20"></u-icon>
                  </view>
                  <image :src="item.icon" class="icon-img"></image>
                </view>
              </view>
            </view>
          </view>
        </view>

        <!-- 快捷入口 - 一行五个 -->
        <view class="quick-wrap">
          <view class="quick-grid">
            <view class="quick-item" v-for="item in quickList" :key="item.id" @click="turnPage(item.url)">
              <image :src="item.icon" class="quick-img"></image>
              <text class="quick-text">{{ item.txt }}</text>
            </view>
          </view>
        </view>

        <!-- 附近电站区域 -->
        <view class="station-section">
          <view class="section-header">
            <view class="section-title">
              <view class="title-line"></view>
              <text class="title-text">附近电站</text>
            </view>
            <view class="location-info" @click="refreshLocation">
              <u-icon name="map-fill" color="#02C046" size="28"></u-icon>
              <text class="location-text">{{ locationText || '正在获取位置...' }}</text>
              <u-icon name="reload" color="#02C046" size="28" class="refresh-icon"></u-icon>
            </view>
          </view>

          <!-- 附近电站列表保持 scroll-view 或同样使用普通 view。这里保持局部滚动，如需整体更顺滑，也可以直接将外层 scroll-view 替换 -->
          <scroll-view class="station-list" scroll-y refresher-enabled
            :refresher-triggered="refresherTriggered" @refresherrefresh="onRefresherRefresh"
            @scrolltolower="onScrollToLower">
            <view class="station-item" v-for="(item,index) in nearPowerList" :key="index"
              @click="goToStationDetail(item)">
              <view class="station-main">
                <view class="station-info">
                  <view class="station-name">{{ item.deviceName }}</view>
                  <view class="station-address">{{ item.deviceAddress }}</view>
                  <view class="station-status">
                    <view class="status-tag" :class="item.deviceStatus == 1 ? 'online' : 'offline'">
                      {{ item.deviceStatus == 1 ? '在线' : '离线' }}
                    </view>
                    <view class="socket-info">
                      <text class="socket-free">空闲{{ item.freeNum || '0' }}</text>
                      <text class="socket-total">/{{ item.socketNum || '0' }}</text>
                    </view>
                  </view>
                </view>
                <view class="station-action">
                  <view class="distance">距你{{ (item.distance || 0).toFixed(0) }}m</view>
                  <view class="nav-btn" @click.stop="navigateToStation(item)">
                    <u-icon name="map" color="#fff" size="24"></u-icon>
                    <text>导航</text>
                  </view>
                </view>
              </view>
            </view>

            <view class="load-status">
              <text v-if="nearPowerList.length == 0 && loadingStatus.near != 'loading'"
                class="no-data">暂无附近电站</text>
              <text v-if="loadingStatus.near == 'loading'" class="loading-text">加载中...</text>
              <text v-else-if="loadingStatus.near == 'noMore' && nearPowerList.length > 0"
                class="no-more-text">— 没有更多了 —</text>
            </view>
          </scroll-view>
        </view>
      </view>
    </view>

    <my-tabbar :list="tabbar" mid-button mid-button-size="120" @change="changeTabar"></my-tabbar>
  </view>
</template>

<script>
  import mySwiper from "@/components/my-swiper.vue";
  import myTabbar from "@/components/my-tabbar/my-tabbar.vue"
  import wechatSDK from "@/utils/wechat.js";
  import {
    formatTime
  } from "@/utils/util";
  import {
    ChargingPileModel
  } from "@/models/chargingPile.js";
  const chargingPileModel = new ChargingPileModel();
  import {
    mapState
  } from 'vuex'
  import {
    UserModel
  } from "@/models/user.js";
  const userModel = new UserModel();
  import {
    OrderModel
  } from "@/models/order.js";
  const orderModel = new OrderModel();

  export default {
    computed: {
      ...mapState(['tabbar'])
    },
    data() {
      return {
        statusBarHeight: 20,
        navBarHeight: 45,
        swiperList: [],
        chargingOrder: [], // 充电中订单列表
        chargingTimer: null, // 充电计时器
        iconList: [{
            id: 1,
            txt: "充电订单",
            icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/充电订单.png",
            url: "/packageMy/pages/powerOrder",
            bgColor: "#ECF8F0",
            color: "#008C3C"
          },
          {
            id: 2,
            txt: "充值中心",
            icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/充值中心.png",
            url: "/pages/index/chargeCenter",
            bgColor: "#EEF8EF",
            color: "#007A2D"
          },
          {
            id: 3,
            txt: "我的电卡",
            icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/我的电卡.png",
            url: "/packageMy/pages/card",
            bgColor: "#FFF4E6",
            color: "#C85B00"
          },
          {
            id: 4,
            txt: "故障报修",
            icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/故障报修.png",
            url: "/packageMy/pages/repair",
            bgColor: "#FDEDEE",
            color: "#F21818"
          }
        ],
        // 快捷入口列表
        quickList: [{
          id: 1,
          txt: "常用电站",
          icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/常用电站.png",
          url: "/packageMy/pages/often"
        }, {
          id: 2,
          txt: "免费充电",
          icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/免费充电.png",
          url: "/pages/vod/index"
        }, {
          id: 3,
          txt: "0元加盟",
          icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/0元加盟.png",
          url: "/packageIndex/pages/join"
        }, {
          id: 4,
          txt: "使用流程",
          icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/使用流程.png",
          url: "/packageIndex/pages/use"
        }, {
          id: 5,
          txt: "我的客服",
          icon: "https://tempapi.huiyifamily.com/profile/charge/images/index/我的客服.png",
          url: "/packageIndex/pages/custom"
        }],

        // 附近电站相关数据
        nearPowerList: [],
        locationText: '',
        currentLocation: null,
        loadingStatus: {
          near: 'more'
        },
        pageParams: {
          near: {
            page: 1,
            pageSize: 10
          }
        },
        // 下拉刷新状态
        refresherTriggered: false
      };
    },
    created() {
      this.statusBarHeight = uni.getStorageSync("statusBarHeight");
      this.navBarHeight = uni.getStorageSync("navBarHeight");
    },
    components: {
      "my-swiper": mySwiper,
      "my-tabbar": myTabbar
    },
    onLoad(options) {
      this.reqBanners();
      this.getCurrentLocation();

      if (!uni.getStorageSync('token')) return;

      if (options.redirect) {
        this.$go("/pages/index/chargeCenter");
      }

      if (options.sid || options.id || options.deviceId) {
        const sid = options.sid || options.id || options.deviceId;
        this.$go(`/pages/index/charge?sid=${sid}`);
      }
    },
    onShow() {
      if (uni.getStorageSync('token')) {
        this.getChargingOrders();
        this.reqMyBalance();
      }
    },
    onUnload() {
      // 页面卸载时清理计时器
      this.clearChargingTimer();
    },

    // 监听原生页面下拉刷新（如果需要原生下拉刷新功能，需在 pages.json 中开启 enablePullDownRefresh）
    onPullDownRefresh() {
      this.getCurrentLocation();
      setTimeout(() => {
        uni.stopPullDownRefresh();
      }, 1000);
    },

    // 分享给朋友（转发）
    onShareAppMessage() {
      return {
        title: `慧亿家首页`,
        path: `/pages/index/index`,
        success: () => {
          // 分享成功回调
          uni.showToast({
            title: '分享成功',
            icon: 'success'
          })
        },
        fail: (err) => {
          console.log('分享失败:', err)
        }
      }
    },

    // 分享到朋友圈（微信小程序）
    onShareTimeline() {
      return {
        title: `慧亿家首页`,
      }
    },
    methods: {
      changeTabar(e) {
        if (e == 2) {
          this.$scanCode()
        }
      },
      reqBanners() {
        chargingPileModel.getHomeBanner().then(res => {
          this.swiperList = res.data;
        });
      },
      getItemDesc(id) {
        const descMap = {
          1: '查看充电记录',
          2: '余额充值管理',
          3: '电卡信息管理',
          4: '设备故障报修'
        };
        return descMap[id] || '';
      },
      turnPage(url) {
        if (!url) return;

        if (url.startsWith('/pages')) {
          uni.reLaunch({
            url: url
          });
        } else {
          // 其他页面使用普通跳转
          this.$go(url);
        }
      },
      //获取个人余额
      reqMyBalance() {
        userModel.getBanlance().then(res => {
          if (res.code == 200) {
            this.userMoney = res.data.userMoney;
          }
        })
      },

      // 位置相关方法
      getCurrentLocation() {
        // #ifdef H5
        // 微信网页环境使用微信JS-SDK
        wechatSDK.getLocation().then((res) => {
          console.log('获取到的位置信息:', res);
          this.currentLocation = res;
          this.reverseGeocode(res.latitude, res.longitude);
          this.reqNearLocation(true);
        });
        // #endif

        // #ifdef MP-WEIXIN
        // 小程序环境使用uni.getLocation
        uni.getLocation({
          type: 'gcj02',
          success: (res) => {
            this.currentLocation = res;
            this.reverseGeocode(res.latitude, res.longitude);
            this.reqNearLocation(true);
          }
        });
        // #endif
      },

      // 逆地理编码获取地址信息
      reverseGeocode(latitude, longitude) {
        // 模拟解析结果
        setTimeout(() => {
          this.locationText = "重新定位";
        }, 1000);
      },

      // 刷新位置
      refreshLocation() {
        this.getCurrentLocation();
      },

      // 获取附近电站
      reqNearLocation(isRefresh = false) {
        uni.showLoading({
          mask: true,
        })
        if (!this.currentLocation) {
          this.getCurrentLocation();
          return;
        }

        if (this.loadingStatus.near == 'loading') return;

        if (isRefresh) {
          this.pageParams.near.page = 1;
          this.loadingStatus.near = 'loading';
        }

        chargingPileModel.getNearby({
          longitude: this.currentLocation.longitude,
          latitude: this.currentLocation.latitude,
          pageNum: this.pageParams.near.page,
          pageSize: this.pageParams.near.pageSize
        }).then(res => {
          if (res.code == 200) {
            uni.hideLoading()
            if (isRefresh) {
              this.nearPowerList = res.rows || [];
            } else {
              this.nearPowerList = [...this.nearPowerList, ...(res.rows || [])];
            }

            // 判断是否还有更多数据
            if (res.rows.length < this.pageParams.near.pageSize) {
              this.loadingStatus.near = 'noMore';
            } else {
              this.pageParams.near.page++;
              this.loadingStatus.near = 'more';
            }
          }
        }).catch(() => {
          uni.hideLoading()
          this.loadingStatus.near = 'more';
        }).finally(() => {
          // 关闭下拉刷新状态
          if (this.refresherTriggered) {
            setTimeout(() => {
              this.refresherTriggered = false;
            }, 500);
          }
        });
      },
      // 下拉刷新
      onRefresherRefresh() {
        this.refresherTriggered = true;
        this.getCurrentLocation();
      },

      // 触底加载
      onScrollToLower() {
        if (this.loadingStatus.near === 'more') {
          this.reqNearLocation(false);
        }
      },
      // 导航到电站
      navigateToStation(item) {
        const {
          latitude,
          longitude,
          deviceName,
          deviceAddress
        } = item
        wx.openLocation({
          latitude,
          longitude,
          name: deviceName, // 可选，如果不知道可以省略
          address: deviceAddress, // 可选，如果不知道可以省略
          scale: 28, // 地图缩放级别,范围从1~28。默认为最大
          success: function(res) {
            console.log(res);
          },
          fail: function(err) {
            console.log(err);
          }
        })
      },

      // 进入电站详情
      goToStationDetail(item) {
        if (item.deviceExtendNo) {
          uni.navigateTo({
            url: "/pages/index/charge?sid=" + item.deviceExtendNo
          });
        } else {
          this.$toast('暂无法查看该电站详情')
        }
      },

      // 获取充电中订单
      async getChargingOrders() {
        try {
          const currentTime = new Date();
          const oneYearAgo = new Date(currentTime.getTime() - 365 * 24 * 60 * 60 * 1000);

          const params = {
            timeSelectCondition: 1,
            orderStatus: 1, // 1表示充电中
            deviceType: 1, // 设备类型
            pageNum: 1,
            pageSize: 10,
            endTime: formatTime(currentTime),
            startTime: formatTime(oneYearAgo)
          };

          const res = await orderModel.getOrderList(params);

          if (res.code == 200) {
            this.chargingOrder = res.rows; //暂时过滤掉汽车订单

            // 如果有充电中的订单，启动计时器
            if (this.chargingOrder.length > 0 && !this.chargingTimer) {
              this.startChargingTimer();
            } else if (this.chargingOrder.length == 0 && this.chargingTimer) {
              clearInterval(this.chargingTimer);
              this.chargingTimer = null;
            }
          }
        } catch (error) {
          console.error('获取充电订单失败:', error);
        }
      },

      // 启动充电计时器（每分钟更新一次）
      startChargingTimer() {
        this.chargingTimer = setInterval(() => {
          // 触发视图更新
          this.chargingOrder = [...this.chargingOrder];
        }, 60000); // 每分钟更新一次
      },

      // 格式化时间为 HH:mm:ss（只显示时分秒）
      formatTimeToHM(timeStr) {
        if (!timeStr) return '--:--:--';
        const date = new Date(timeStr);
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
      },

      // 跳转到结束充电页面
      goToEndCharging(item) {
        const url = item.deviceType == '3' || item.deviceType == '2' || item.deviceType == '6' ?
          `/packageCar/pages/recharge?orderId=${item.orderId}` :
          `/pages/index/startCharge?orderId=${item.orderId}&deviceType=${item.deviceType}&noTip=true`;
        this.$go(url);
      },

      // 清理计时器
      clearChargingTimer() {
        if (this.chargingTimer) {
          clearInterval(this.chargingTimer);
          this.chargingTimer = null;
        }
      }
    }
  };
</script>
