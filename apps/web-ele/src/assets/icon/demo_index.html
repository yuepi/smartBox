<script lang="ts" setup>
import { computed, onMounted, onUnmounted, ref } from 'vue'

// ===== 配置参数 =====
const MUSIC_URL = '/bgm.mp3' // 音乐文件路径
const LOOP_START = 15 // 循环开始时间（秒）
const LOOP_END = 45 // 循环结束时间（秒）
const VOLUME = 0.3 // 音量 0-1

// ===== 状态 =====
const audio = new Audio(MUSIC_URL)
audio.loop = false // 不使用原生 loop，手动控制
audio.volume = VOLUME

const isPlaying = ref(false)
const currentTime = ref(0)
const duration = ref(0)

// ===== 进度计算 =====
const progress = computed(() => {
  if (duration.value === 0) return 0
  return (currentTime.value / duration.value) * 100
})

// ===== 核心逻辑：循环段落 =====
const handleTimeUpdate = () => {
  currentTime.value = audio.currentTime

  // 如果到达循环结束点，跳回开始点
  if (audio.currentTime >= LOOP_END) {
    audio.currentTime = LOOP_START
  }
}

// ===== 播放/暂停 =====
const togglePlay = () => {
  if (isPlaying.value) {
    audio.pause()
  } else {
    // 如果已经播完或未开始，从循环起点开始
    if (audio.currentTime === 0 || audio.currentTime >= LOOP_END) {
      audio.currentTime = LOOP_START
    }
    audio.play().catch((error) => {
      console.warn('音频播放被拦截:', error)
    })
  }
  isPlaying.value = !isPlaying.value
}

// ===== 进度条跳转 =====
const handleSeek = (e: Event) => {
  const target = e.target as HTMLInputElement
  const percent = Number.parseFloat(target.value) / 100
  audio.currentTime = percent * duration.value

  // 如果跳转位置超出循环结束点，强制拉到循环起点
  if (audio.currentTime > LOOP_END) {
    audio.currentTime = LOOP_START
  }
}

// ===== 加载完成时获取总时长 =====
const handleLoadedMetadata = () => {
  duration.value = audio.duration
}

// ===== 页面可见性变化：切后台时暂停 =====
const handleVisibilityChange = () => {
  if (document.hidden && isPlaying.value) {
    audio.pause()
    isPlaying.value = false
  }
}

// ===== 生命周期 =====
onMounted(() => {
  audio.addEventListener('timeupdate', handleTimeUpdate)
  audio.addEventListener('loadedmetadata', handleLoadedMetadata)
  // 预加载音频
  audio.load()
  document.addEventListener('visibilitychange', handleVisibilityChange)
})

onUnmounted(() => {
  audio.removeEventListener('timeupdate', handleTimeUpdate)
  audio.removeEventListener('loadedmetadata', handleLoadedMetadata)
  document.removeEventListener('visibilitychange', handleVisibilityChange)
  audio.pause()
  audio.src = ''
})
</script>

<template>
  <div class="music-player fixed bottom-6 right-6 z-50 flex cursor-pointer items-center gap-2 rounded-full bg-black/60 px-3 py-2 text-white backdrop-blur-sm transition-all hover:bg-black/80">
    <!-- 音符图标 -->
    <span
      class="text-xl transition-transform duration-700"
      :class="isPlaying ? 'animate-spin-slow' : ''"
      @click="togglePlay"
    >
      🎵
    </span>

    <!-- 播放/暂停按钮 -->
    <span class="text-xs" @click="togglePlay">
      {{ isPlaying ? '播放中' : '已暂停' }}
    </span>

    <!-- 进度条（可选） -->
    <input
      v-if="isPlaying"
      type="range"
      min="0"
      max="100"
      :value="progress"
      class="w-20 accent-cyan-400"
      @input="handleSeek"
    />
  </div>
</template>

<style scoped>
@keyframes spin-slow {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.animate-spin-slow {
  animation: spin-slow 4s linear infinite;
}
</style>
