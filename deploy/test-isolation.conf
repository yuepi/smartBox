# 仅供 recycletest.huishoucloud.com 使用，禁止安装到正式站点。
# 白名单不含正式接口域名，配置误写时浏览器也会阻止连接。
add_header Content-Security-Policy "connect-src 'self' ws://recycletest.huishoucloud.com wss://recycletest.huishoucloud.com https://recycletestapi.huishoucloud.com https://*.amap.com https://*.aliyuncs.com; form-action 'self'" always;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8342;
    proxy_set_header Host recycletestapi.huishoucloud.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
}

# 入口和运行时配置禁止缓存，避免沿用旧接口地址。
location = /index.html {
    expires -1;
}
location = /_app.config.js {
    expires -1;
}
